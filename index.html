<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Люблю тебя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pacifico&family=Caveat:wght@500;700&display=swap">
<style>
  /* Один экран: пульсирующее сердце в центре, надпись внизу, сердечки на canvas поверх фона */
  :root {
    --bg-1: #ff8fb1;
    --bg-2: #e0115f;
    --bg-3: #7a0a2e;
    --heart: #ff1f4b;
    --heart-deep: #b3002d;
    --cream: #fff3f6;
    --glow: rgba(255, 220, 232, .85);
    --script: "Great Vibes", "Segoe Script", cursive;
    --display: "Pacifico", "Georgia", serif;
    --hand: "Caveat", "Comic Sans MS", cursive;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg-3);
    color: var(--cream);
    font-family: var(--script);
  }
  .sky {
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 50% 42%, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    background-size: 160% 160%;
    animation: breathe 8s ease-in-out infinite alternate;
  }
  @keyframes breathe {
    from { background-position: 45% 40%; }
    to   { background-position: 55% 60%; }
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #back { z-index: 1; }
  #front { z-index: 3; }

  .stage {
    position: fixed; inset: 0; z-index: 2;
    display: grid;
    grid-template-rows: 1fr auto;
    justify-items: center;
    align-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: env(safe-area-inset-top, 0px) calc(28px + env(safe-area-inset-bottom, 0px));
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .heart {
    position: relative;
    width: min(78vw, 62vh, 520px);
    aspect-ratio: 1 / .92;
    max-width: 100%;
    display: grid;
    place-items: center;
    animation: pop 1.1s cubic-bezier(.2, 1.6, .4, 1) both, beat 1.3s ease-in-out 1.1s infinite;
    filter: drop-shadow(0 0 30px rgba(255, 40, 90, .75)) drop-shadow(0 18px 40px rgba(80, 0, 20, .55));
  }
  .heart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .heart .shine { mix-blend-mode: screen; opacity: .55; }
  @keyframes pop {
    0%   { transform: scale(0) rotate(-20deg); }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    14%      { transform: scale(1.09); }
    28%      { transform: scale(1); }
    42%      { transform: scale(1.06); }
    70%      { transform: scale(1); }
  }

  .love {
    position: relative;
    margin: 0;
    margin-top: -8%;
    font-family: var(--script);
    font-weight: 400;
    font-size: clamp(3rem, min(14vw, 11vh), 6.6rem);
    line-height: 1.05;
    text-align: center;
    color: var(--cream);
    -webkit-text-stroke: .6px var(--cream);
    text-shadow: 0 0 10px var(--glow), 0 0 28px rgba(255, 255, 255, .55), 0 3px 2px var(--heart-deep);
  }
  .love span {
    display: inline-block;
    animation: rise .7s cubic-bezier(.2, 1.4, .4, 1) both;
  }

  .bon {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(1.6rem, 6.4vw, 3rem);
    line-height: 1.3;
    text-align: center;
    text-wrap: balance;
    color: var(--cream);
    text-shadow: 0 0 18px rgba(255, 60, 110, .9), 0 2px 0 var(--heart-deep);
    animation: rise 1s cubic-bezier(.2, 1.3, .4, 1) 1.6s both, shimmer 3s ease-in-out 2.6s infinite;
  }
  .bottom { display: grid; justify-items: center; gap: 6px; }
  .ps {
    margin: 0;
    font-family: var(--hand);
    font-weight: 700;
    font-size: clamp(1.3rem, 4.6vw, 2rem);
    text-align: center;
    color: var(--cream);
    text-shadow: 0 0 12px rgba(255, 60, 110, .8);
    transform: rotate(-3deg);
    animation: rise 1s cubic-bezier(.2, 1.3, .4, 1) 2.6s both;
  }
  .ps b { color: #ffd1de; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(30px) scale(.6); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes shimmer {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-6px) rotate(1deg); }
  }

  .hint {
    position: fixed; z-index: 4;
    right: calc(14px + env(safe-area-inset-right, 0px));
    top: calc(12px + env(safe-area-inset-top, 0px));
    font: 15px/1 var(--script);
    color: var(--cream);
    opacity: .7;
  }

  @media (prefers-reduced-motion: reduce) {
    .sky, .heart, .bon, .love span { animation: none !important; }
  }
</style>
</head>
<body>

<div class="sky"></div>
<canvas id="back"></canvas>

<main class="stage" id="stage">
  <div class="heart" aria-hidden="false">
    <svg viewBox="0 0 100 92" aria-hidden="true">
      <defs>
        <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff5a7e"/>
          <stop offset=".55" stop-color="#ff1f4b"/>
          <stop offset="1" stop-color="#b3002d"/>
        </linearGradient>
        <radialGradient id="hs" cx=".3" cy=".25" r=".35">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path fill="url(#hg)" d="M50 90 C 18 66, 2 48, 2 28 C 2 13, 13 2, 27 2 C 37 2, 45 8, 50 17 C 55 8, 63 2, 73 2 C 87 2, 98 13, 98 28 C 98 48, 82 66, 50 90 Z"/>
      <path class="shine" fill="url(#hs)" d="M50 90 C 18 66, 2 48, 2 28 C 2 13, 13 2, 27 2 C 37 2, 45 8, 50 17 C 55 8, 63 2, 73 2 C 87 2, 98 13, 98 28 C 98 48, 82 66, 50 90 Z"/>
    </svg>
    <h1 class="love" id="love">Люблю тебя</h1>
  </div>
  <div class="bottom">
    <p class="bon">Приятного аппетита</p>
    <p class="ps">P.S. <b>Дримми</b> тоже тебя любит ♥</p>
  </div>
</main>

<canvas id="front"></canvas>
<div class="hint">нажми ♥</div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Разбиваем «Люблю тебя» на слова (не на буквы, чтобы рукописные буквы оставались слитными)
  const love = document.getElementById('love');
  const words = love.textContent.split(' ');
  love.textContent = '';
  words.forEach((w, i) => {
    const s = document.createElement('span');
    s.textContent = w;
    s.style.animationDelay = (0.7 + i * 0.35) + 's';
    love.appendChild(s);
    if (i < words.length - 1) love.appendChild(document.createTextNode(' '));
  });

  const back = document.getElementById('back');
  const front = document.getElementById('front');
  const bctx = back.getContext('2d');
  const fctx = front.getContext('2d');
  let W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const c of [back, front]) {
      c.width = W * dpr; c.height = H * dpr;
      c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }
  addEventListener('resize', resize);
  resize();

  const colors = ['#ff1f4b', '#ff4d79', '#ff8fb1', '#ffc2d4', '#e0115f', '#ffffff', '#ff6b8b'];
  const pick = a => a[(Math.random() * a.length) | 0];

  function heartPath(ctx, size) {
    const s = size / 2;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.9);
    ctx.bezierCurveTo(-s * 1.3, s * 0.05, -s * 0.95, -s * 1.05, 0, -s * 0.45);
    ctx.bezierCurveTo(s * 0.95, -s * 1.05, s * 1.3, s * 0.05, 0, s * 0.9);
    ctx.closePath();
  }

  const floaters = []; // плывут снизу вверх за сердцем
  const bursts = [];   // вылетают взрывом поверх всего

  function addFloater(initial) {
    floaters.push({
      x: Math.random() * W,
      y: initial ? Math.random() * H : H + 30,
      size: 10 + Math.random() * 26,
      vy: 0.4 + Math.random() * 1.1,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.01 + Math.random() * 0.02,
      alpha: 0.25 + Math.random() * 0.45,
      color: pick(colors),
      rot: (Math.random() - 0.5) * 0.6
    });
  }

  function burst(x, y, count, power) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = (0.4 + Math.random()) * power;
      bursts.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - power * 0.35,
        size: 10 + Math.random() * 24,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.2,
        life: 1,
        decay: 0.005 + Math.random() * 0.007,
        color: pick(colors)
      });
    }
  }

  function drawHeart(ctx, p, alpha) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = 'rgba(255, 40, 90, .8)';
    ctx.shadowBlur = 10;
    heartPath(ctx, p.size);
    ctx.fill();
    ctx.restore();
  }

  for (let i = 0; i < Math.min(60, W / 18); i++) addFloater(true);

  function frame() {
    bctx.clearRect(0, 0, W, H);
    fctx.clearRect(0, 0, W, H);

    if (Math.random() < 0.25 && floaters.length < 90) addFloater(false);
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y -= f.vy;
      f.sway += f.swaySpeed;
      f.x += Math.sin(f.sway) * 0.6;
      if (f.y < -40) { floaters.splice(i, 1); continue; }
      drawHeart(bctx, f, f.alpha);
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.x += b.vx; b.y += b.vy;
      b.vx *= 0.985; b.vy = b.vy * 0.985 + 0.06;
      b.rot += b.vr;
      b.life -= b.decay;
      if (b.life <= 0) { bursts.splice(i, 1); continue; }
      drawHeart(fctx, b, Math.min(1, b.life * 1.5));
    }
    requestAnimationFrame(frame);
  }

  function heartCenter() {
    const r = document.querySelector('.heart').getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  }

  if (reduce) {
    // Без анимации: просто рассыпаем сердечки по фону
    floaters.forEach(f => drawHeart(bctx, f, f.alpha));
  } else {
    requestAnimationFrame(frame);
    // Залп сердечек при открытии, когда сердце «выпрыгнуло»
    setTimeout(() => { const [x, y] = heartCenter(); burst(x, y, 90, 14); }, 500);
    setTimeout(() => { const [x, y] = heartCenter(); burst(x, y, 60, 10); }, 1300);
    setTimeout(() => { burst(W * 0.15, H * 0.9, 30, 11); burst(W * 0.85, H * 0.9, 30, 11); }, 2000);
    // Время от времени сердце само выпускает пару сердечек
    setInterval(() => { const [x, y] = heartCenter(); burst(x, y, 14, 7); }, 2600);

    document.getElementById('stage').addEventListener('pointerdown', e => {
      burst(e.clientX, e.clientY, 40, 10);
    });
  }
})();
</script>
</body>
</html>
